<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="网页叙事解谜游戏制作总监 Agent：剧情、页面、谜题、图片、文案、QA 与发布。">
  <title>叙事工房 · Webgame Agent</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-kicker">Narrative Workshop</div><h1>叙事工房</h1><small>网页解谜制作总监 Agent</small></div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active" title="总览">◎ <span>总览</span></button>
      <button data-view="projects" title="项目">▦ <span>项目</span></button>
      <button data-view="genre" title="类型判断">⌁ <span>类型判断</span></button>
      <button data-view="experience" title="经验库">✦ <span>经验库</span></button>
      <button data-view="portfolio" title="作品集复盘">▧ <span>作品集</span></button>
      <button data-view="studio" title="AI 制作台">▤ <span>AI 制作台</span></button>
      <button data-view="qa" title="QA">✓ <span>QA</span></button>
      <button data-view="settings" title="设置">⚙ <span>设置</span></button>
    </nav>
    <div class="sidebar-foot"><span class="status-dot" id="workerDot"></span><span id="workerLabel">AI 未连接</span><br>本地项目数据默认只保存在浏览器。</div>
  </aside>
  <main class="main">
    <div class="shell">
      <header class="topbar">
        <div class="topbar-left"><div><div class="eyebrow" id="viewEyebrow">WORKSHOP / OVERVIEW</div><h2 id="viewTitle">制作总览</h2></div></div>
        <div class="top-actions"><button class="btn soft small" id="exportBtn">完整备份</button><button class="btn primary small" id="newProjectBtn">新建项目</button></div>
      </header>
      <div class="content" id="content"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<script src="./config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
